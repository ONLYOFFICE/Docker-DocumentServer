name: Secure rebuild

run-name: >-
  Secure rebuild [
  ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'DRY-RUN' || 'PUBLISH' }}
  ]

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        description: "Dry run (build & test, do not retag release)"
        required: false
        default: false

concurrency:
  group: secure-rebuild
  cancel-in-progress: false

env:
  COMPANY_NAME: "onlyoffice"
  PRODUCT_NAME: "documentserver"
  REBUILD_CONFIG: ".github/secure-rebuild.json"

jobs:
  prepare:
    name: Prepare rebuild matrices
    runs-on: ubuntu-latest

    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      retag_matrix: ${{ steps.matrix.outputs.retag_matrix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate rebuild config
        run: |
          set -euo pipefail

          if [ ! -f "${REBUILD_CONFIG}" ]; then
            echo "Rebuild config was not found: ${REBUILD_CONFIG}" >&2
            exit 1
          fi

          jq -e '
            type == "object"
            and (.releases | type == "object")
            and all(
              .releases[];
              type == "array"
              and all(
                .[];
                (.source_tag | type == "string")
                and (.source_tag | length > 0)
                and (.release_tag | type == "string")
                and (.release_tag | length > 0)
                and (.short_tags | type == "array")
                and all(.short_tags[]; type == "string")
                and (.editions | type == "object")
                and (.editions | length > 0)
                and all(
                  .editions[];
                  type == "object"
                  and has("latest")
                  and (.latest | type == "boolean")
                )
              )
            )
          ' "${REBUILD_CONFIG}" >/dev/null

      - name: Create build and retag matrices
        id: matrix
        run: |
          set -euo pipefail

          BUILD="$(jq -c '
            def ver_key: [splits("\\.")] | map(tonumber);
            {
              include: (
                [
                  .releases
                  | to_entries[]
                  | .value
                  | group_by(.release_tag | split(".") | .[0:3] | join("."))
                  | map(
                      (max_by(.source_tag | ver_key) | .source_tag) as $latest_src
                      | map(select(.source_tag == $latest_src))
                    )
                  | add[]
                  | . as $release
                  | $release.editions
                  | to_entries[]
                  | {
                      source_tag: $release.source_tag,
                      test_tag: (
                        $release.release_tag
                        | split(".")
                        | .[0:3]
                        | join(".")
                      ),
                      edition: .key
                    }
                ]
                | unique_by([
                    .source_tag,
                    .edition
                  ])
              )
            }
          ' "${REBUILD_CONFIG}")"

          RETAG="$(jq -c '
            def ver_key: [splits("\\.")] | map(tonumber);
            {
              include: [
                .releases
                | to_entries[]
                | .value
                | group_by(.release_tag | split(".") | .[0:3] | join("."))
                | map(
                    (max_by(.source_tag | ver_key) | .source_tag) as $latest_src
                    | map(select(.source_tag == $latest_src))
                  )
                | add[]
                | . as $release
                | $release.editions
                | to_entries[]
                | {
                    source_tag: $release.source_tag,
                    release_tag: $release.release_tag,
                    short_tags: (
                      $release.short_tags
                      | join(",")
                    ),
                    is_latest: (
                      .value.latest
                      | tostring
                    ),
                    edition: .key
                  }
              ]
            }
          ' "${REBUILD_CONFIG}")"

          BUILD_COUNT="$(jq '.include | length' <<< "${BUILD}")"
          RETAG_COUNT="$(jq '.include | length' <<< "${RETAG}")"

          if [ "${BUILD_COUNT}" -eq 0 ]; then
            echo "Build matrix is empty" >&2
            exit 1
          fi

          if [ "${RETAG_COUNT}" -eq 0 ]; then
            echo "Retag matrix is empty" >&2
            exit 1
          fi

          echo "Build matrix contains ${BUILD_COUNT} entries:"
          jq . <<< "${BUILD}"

          echo "Retag matrix contains ${RETAG_COUNT} entries:"
          jq . <<< "${RETAG}"

          echo "build_matrix=${BUILD}" >> "${GITHUB_OUTPUT}"
          echo "retag_matrix=${RETAG}" >> "${GITHUB_OUTPUT}"

  rebuild:
    name: "Rebuild ${{ matrix.source_tag }}${{ matrix.edition }}"
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: v${{ matrix.source_tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build secure-patched image
        id: build
        env:
          SOURCE_TAG: ${{ matrix.source_tag }}
          EDITION: ${{ matrix.edition }}
        run: |
          set -euo pipefail

          PATCHED_IMAGE="${COMPANY_NAME}/4testing-${PRODUCT_NAME}${EDITION}:${SOURCE_TAG}-secure"
          # source_tag = 9.4.1.15 → PRODUCT_VERSION=9.4.1  BUILD_NUMBER=15
          PACKAGE_VERSION="${SOURCE_TAG%.*}"

          # Enterprise editions build from Dockerfile.enterprise when it exists
          # in the checked-out tag (introduced in v10). Otherwise use the default.
          if { [ "${EDITION}" = "-ee" ] || [ "${EDITION}" = "-de" ]; } && [ -f "Dockerfile.enterprise" ]; then
            DOCKERFILE="Dockerfile.enterprise"
          else
            DOCKERFILE="Dockerfile"
          fi

          echo "Patched image: ${PATCHED_IMAGE}"
          echo "Package version: ${PACKAGE_VERSION}"
          echo "Dockerfile:      ${DOCKERFILE}"

          docker buildx build \
            --platform "linux/amd64,linux/arm64" \
            --build-arg "COMPANY_NAME=${COMPANY_NAME}" \
            --build-arg "PRODUCT_NAME=${PRODUCT_NAME}" \
            --build-arg "PRODUCT_EDITION=${EDITION}" \
            --build-arg "PACKAGE_VERSION=${PACKAGE_VERSION}" \
            --tag "${PATCHED_IMAGE}" \
            --sbom=true \
            --provenance=mode=max \
            --file "${DOCKERFILE}" \
            --metadata-file metadata.json \
            --push \
            .

          echo "patched_image=${PATCHED_IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Extract secure image digest
        id: image
        env:
          EDITION: ${{ matrix.edition }}
        run: |
          set -euo pipefail

          IMAGE="${COMPANY_NAME}/4testing-${PRODUCT_NAME}${EDITION}"
          DIGEST="$(jq -r '."containerimage.digest"' metadata.json)"

          if [ -z "${DIGEST}" ] || [ "${DIGEST}" = "null" ]; then
            echo "Failed to get image digest from metadata.json" >&2
            cat metadata.json >&2
            exit 1
          fi

          echo "Image: ${IMAGE}"
          echo "Digest: ${DIGEST}"

          echo "name=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Attest secure image
        uses: actions/attest@v4
        with:
          subject-name: docker.io/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Clean-up
        run: |
          set -euo pipefail

          docker rm --force documentserver 2>/dev/null || true
          docker buildx prune -af 
          docker image prune -af
          docker builder prune -af

      - name: Checkout smoke tests
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: smoke-ci
          sparse-checkout: .github/scripts

      - name: Install smoke test dependencies
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils
          pip install --quiet --break-system-packages "selenium==4.27.1"

      - name: Pull test image
        env:
          IMAGE: ${{ steps.build.outputs.patched_image }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if docker pull "${IMAGE}"; then
              echo "Image pulled successfully"
              exit 0
            fi

            if [ "${attempt}" -eq 30 ]; then
              echo "Image was not available after 5 minutes" >&2
              exit 1
            fi

            echo "Image is not available yet, retrying in 10 seconds"
            sleep 10
          done

      - name: Start test container
        env:
          IMAGE: ${{ steps.build.outputs.patched_image }}
        run: |
          set -euo pipefail

          SMOKE_JWT_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::${SMOKE_JWT_SECRET}"
          echo "SMOKE_JWT_SECRET=${SMOKE_JWT_SECRET}" >> "${GITHUB_ENV}"

          # JWT_SECRET: known secret, so the tests can sign API requests
          # ALLOW_PRIVATE_IP_ADDRESS + host-gateway: Docs downloads test files from the runner
          # SECURE_LINK_SECRET: result links stay valid across the restart check
          docker run \
            --detach \
            --publish 80:80 \
            --name documentserver \
            --add-host host.docker.internal:host-gateway \
            --env JWT_SECRET="${SMOKE_JWT_SECRET}" \
            --env ALLOW_PRIVATE_IP_ADDRESS=true \
            --env SECURE_LINK_SECRET="$(openssl rand -hex 32)" \
            "${IMAGE}"

      - name: Run smoke tests
        timeout-minutes: 30
        env:
          SOURCE_TAG: ${{ matrix.source_tag }}
          EDITION: ${{ matrix.edition }}
        run: |
          set -euo pipefail

          export SMOKE_TITLE="${SOURCE_TAG}${EDITION}"
          export SMOKE_ARTIFACTS="${RUNNER_TEMP}/smoke-artifacts"
          python3 smoke-ci/.github/scripts/smoke.py

      - name: Upload smoke screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.source_tag }}${{ matrix.edition }}
          path: ${{ runner.temp }}/smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Container logs
        if: failure()
        run: |
          docker ps --all --filter name=documentserver || true
          docker exec documentserver supervisorctl status || true
          docker exec documentserver sh -c '
            for file in /var/log/onlyoffice/documentserver/docservice/out.log \
                        /var/log/onlyoffice/documentserver/converter/out.log \
                        /var/log/onlyoffice/documentserver-example/out.log \
                        /var/log/onlyoffice/documentserver/nginx.error.log; do
              [ -f "$file" ] && { printf "\n=== %s ===\n" "$file"; tail -n 200 "$file"; }
            done' || true
          docker logs --tail 300 documentserver || true


  retag:
    name: "Retag all releases"
    needs:
      - prepare
      - rebuild

    if: >-
      ${{
        github.event_name != 'workflow_dispatch'
        || !inputs.dry_run
      }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Retag all releases in order
        uses: nick-fields/retry@v4
        env:
          PRODUCT_NAME: ${{ env.PRODUCT_NAME }}
          REBUILD_CONFIG: ${{ env.REBUILD_CONFIG }}
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 60
          command: |
            set -euo pipefail

            # Build the ordered retag list, applying the same
            # "latest source_tag per minor" filter as the build matrix.
            #
            # reverse: oldest releases (bottom of JSON) are pushed first,
            # newest (top of JSON) last — so newest end up at the top of
            # Docker Hub's tag list, which sorts by push time.
            RETAG="$(jq -c '
              def ver_key: [splits("\\.")] | map(tonumber);
              [
                .releases
                | to_entries[]
                | .value
                | group_by(.release_tag | split(".") | .[0:3] | join("."))
                | map(
                    (max_by(.source_tag | ver_key) | .source_tag) as $latest_src
                    | map(select(.source_tag == $latest_src))
                  )
                | add[]
                | . as $release
                | $release.editions
                | to_entries[]
                | {
                    source_tag: $release.source_tag,
                    release_tag: $release.release_tag,
                    short_tags: ($release.short_tags | join(",")),
                    is_latest: (.value.latest | tostring),
                    edition: .key,
                    sort_key: ($release.release_tag | ver_key)
                  }
              ]
              | sort_by(.sort_key)
            ' "${REBUILD_CONFIG}")"

            COUNT="$(jq 'length' <<< "${RETAG}")"

            if [ "${COUNT}" -eq 0 ]; then
              echo "Retag list is empty" >&2
              exit 1
            fi

            echo "Retagging ${COUNT} entries (oldest first)"

            for i in $(seq 0 $((COUNT - 1))); do
              ENTRY="$(jq -c ".[${i}]" <<< "${RETAG}")"

              SOURCE_TAG="$(jq -r '.source_tag'  <<< "${ENTRY}")"
              RELEASE_TAG="$(jq -r '.release_tag' <<< "${ENTRY}")"
              SHORT_TAGS="$(jq -r '.short_tags'   <<< "${ENTRY}")"
              IS_LATEST="$(jq -r '.is_latest'     <<< "${ENTRY}")"
              EDITION="$(jq -r '.edition'         <<< "${ENTRY}")"

              RELEASE_IMAGE="${COMPANY_NAME}/${PRODUCT_NAME}${EDITION}"
              SRC_IMAGE="${COMPANY_NAME}/4testing-${PRODUCT_NAME}${EDITION}:${SOURCE_TAG}-secure"

              echo "=============================================="
              echo "Source image:  ${SRC_IMAGE}"
              echo "Release image: ${RELEASE_IMAGE}"
              echo "Release tag:   ${RELEASE_TAG}"
              echo "Short tags:    ${SHORT_TAGS}"
              echo "Latest:        ${IS_LATEST}"

              docker buildx imagetools inspect "${SRC_IMAGE}"

              PUSH_TAGS=(
                --tag "${RELEASE_IMAGE}:${RELEASE_TAG}"
              )

              if [ -n "${SHORT_TAGS}" ]; then
                IFS=',' read -r -a SHORTS <<< "${SHORT_TAGS}"
                for tag in "${SHORTS[@]}"; do
                  if [ -n "${tag}" ]; then
                    PUSH_TAGS+=( --tag "${RELEASE_IMAGE}:${tag}" )
                  fi
                done
              fi

              if [ "${IS_LATEST}" = "true" ]; then
                PUSH_TAGS+=( --tag "${RELEASE_IMAGE}:latest" )
              fi

              docker buildx imagetools create \
                "${PUSH_TAGS[@]}" \
                "${SRC_IMAGE}"

              docker buildx imagetools inspect \
                "${RELEASE_IMAGE}:${RELEASE_TAG}"
            done

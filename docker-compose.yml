services:
  onlyoffice-documentserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: onlyoffice/documentserver:${TAG:-latest}
    container_name: onlyoffice-documentserver
    # JWT is enabled by default with a random secret kept in the Data volume; uncomment to set your own strong JWT_SECRET (or JWT_SECRET_FILE):
    #environment:
    #  - JWT_ENABLED=true
    #  - JWT_SECRET=secret
    #  - JWT_HEADER=Authorization
    #  - JWT_IN_BODY=true
    ports:
      - '80:80'
      - '443:443'
    stdin_open: true
    restart: always
    stop_grace_period: 60s
    volumes:
       - onlyoffice_data:/var/www/onlyoffice/Data
       - onlyoffice_logs:/var/log/onlyoffice
       - onlyoffice_cache:/var/lib/onlyoffice/documentserver/App_Data/cache/files
       - onlyoffice_example_files:/var/www/onlyoffice/documentserver-example/public/files
       - /usr/share/fonts

volumes:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_cache:
  onlyoffice_example_files:

services:
  onlyoffice-documentserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: onlyoffice/documentserver:${TAG:-latest}
    container_name: onlyoffice-documentserver
    # JWT validation is enabled by default with a new random secret on each start.
    # Uncomment and set your own strong JWT_SECRET to keep integrations working after restarts:
    #environment:
    #  - JWT_ENABLED=true
    #  - JWT_SECRET=secret
    #  - JWT_HEADER=Authorization
    #  - JWT_IN_BODY=true
    ports:
      - '80:80'
      - '443:443'
    stdin_open: true
    restart: always
    stop_grace_period: 60s
    volumes:
       - /var/www/onlyoffice/Data
       - /var/log/onlyoffice
       - /var/lib/onlyoffice/documentserver/App_Data/cache/files
       - /var/www/onlyoffice/documentserver-example/public/files
       - /usr/share/fonts

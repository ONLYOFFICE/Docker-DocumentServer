# Logstash 配置文件 - 处理 ONLYOFFICE 日志

input {
  # 读取审计日志
  file {
    path => "/var/log/onlyoffice/audit.log"
    start_position => "beginning"
    codec => json
    tags => ["audit"]
  }

  # 读取错误日志
  file {
    path => "/var/log/onlyoffice/error.log"
    start_position => "beginning"
    codec => json
    tags => ["error"]
  }

  # 读取性能日志
  file {
    path => "/var/log/onlyoffice/performance.log"
    start_position => "beginning"
    codec => json
    tags => ["performance"]
  }

  # 读取追踪日志
  file {
    path => "/var/log/onlyoffice/trace.log"
    start_position => "beginning"
    codec => json
    tags => ["trace"]
  }

  # 读取并发日志
  file {
    path => "/var/log/onlyoffice/concurrency.log"
    start_position => "beginning"
    codec => json
    tags => ["concurrency"]
  }

  # 读取用户活动日志
  file {
    path => "/var/log/onlyoffice/activity.log"
    start_position => "beginning"
    codec => json
    tags => ["activity"]
  }

  # 读取应用日志
  file {
    path => "/var/log/onlyoffice/app.log"
    start_position => "beginning"
    tags => ["app"]
  }
}

filter {
  # 解析 JSON 日志
  if [type] == "json" {
    json {
      source => "message"
      target => "parsed"
    }
  }

  # 审计日志处理
  if "audit" in [tags] {
    mutate {
      add_field => { "[@metadata][index]" => "onlyoffice-audit-%{+YYYY.MM.dd}" }
      add_field => { "log_type" => "audit" }
    }
  }

  # 错误日志处理
  if "error" in [tags] {
    mutate {
      add_field => { "[@metadata][index]" => "onlyoffice-error-%{+YYYY.MM.dd}" }
      add_field => { "log_type" => "error" }
    }
    # 从错误堆栈跟踪中提取错误代码
    grok {
      match => { "message" => "error_code.?:[\s]*['\"]?(?<error_code>[^'\"]+)" }
      tag_on_failure => []
    }
  }

  # 性能日志处理
  if "performance" in [tags] {
    mutate {
      add_field => { "[@metadata][index]" => "onlyoffice-perf-%{+YYYY.MM.dd}" }
      add_field => { "log_type" => "performance" }
    }
    # 转换持续时间为数值类型
    if [duration_ms] {
      mutate {
        convert => { "duration_ms" => "integer" }
      }
    }
  }

  # 并发日志处理
  if "concurrency" in [tags] {
    mutate {
      add_field => { "[@metadata][index]" => "onlyoffice-concurrency-%{+YYYY.MM.dd}" }
      add_field => { "log_type" => "concurrency" }
    }
    # 提取并发用户数
    if [concurrent_users] {
      mutate {
        convert => { "concurrent_users" => "integer" }
      }
    }
  }

  # 追踪日志处理
  if "trace" in [tags] {
    mutate {
      add_field => { "[@metadata][index]" => "onlyoffice-trace-%{+YYYY.MM.dd}" }
      add_field => { "log_type" => "trace" }
    }
  }

  # 用户活动日志处理
  if "activity" in [tags] {
    mutate {
      add_field => { "[@metadata][index]" => "onlyoffice-activity-%{+YYYY.MM.dd}" }
      add_field => { "log_type" => "activity" }
    }
  }

  # 应用日志处理
  if "app" in [tags] {
    mutate {
      add_field => { "[@metadata][index]" => "onlyoffice-app-%{+YYYY.MM.dd}" }
      add_field => { "log_type" => "app" }
    }
    # 尝试从应用日志中提取关键信息
    grok {
      match => { "message" => "(?<timestamp>\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}:\d{2})\s+\[(?<level>\w+)\]\s+(?<component>\w+):\s+(?<message>.*)" }
      tag_on_failure => []
    }
  }

  # 通用日志处理
  # 添加主机名和环境信息
  mutate {
    add_field => { "[@metadata][hostname]" => "${HOSTNAME:localhost}" }
    add_field => { "[@metadata][environment]" => "${ENVIRONMENT:production}" }
  }

  # 解析时间戳
  if [timestamp] {
    date {
      match => [ "timestamp", "yyyy-MM-dd HH:mm:ss", "ISO8601" ]
      target => "@timestamp"
    }
  } else {
    # 使用当前时间
    date {
      match => [ "timestamp", "UNIX" ]
    }
  }

  # 地理位置查询 (如果有 IP)
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }

  # 字段转换和标准化
  mutate {
    # 转换常见的数值字段
    convert => {
      "concurrent_users" => "integer"
      "duration_ms" => "integer"
      "status_code" => "integer"
      "memory_delta" => "integer"
      "cpu_usage" => "float"
      "memory_percent" => "float"
    }
  }

  # 添加环境标签
  mutate {
    add_tag => [ "onlyoffice", "elasticsearch" ]
    add_field => { "version" => "1.0" }
  }
}

output {
  # 输出到 Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index]}"
    document_id => "%{[id]}"
  }

  # 调试输出到控制台 (仅在需要时启用)
  # stdout {
  #   codec => rubydebug
  # }

  # 重要告警输出到单独的索引
  if [level] == "ERROR" or [level] == "CRITICAL" or [level] == "WARN" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "onlyoffice-alerts-%{+YYYY.MM.dd}"
    }
  }
}

# ===========================================
# Logstash 配置说明:
# ===========================================
#
# 1. Input 阶段:
#    - 从 /var/log/onlyoffice 目录读取各种日志文件
#    - 支持 JSON 和纯文本格式
#    - 通过 tags 标记不同的日志类型
#
# 2. Filter 阶段:
#    - 解析 JSON 日志字段
#    - 提取关键信息 (错误代码、性能指标、并发数)
#    - 转换数据类型 (字符串 -> 整数/浮点)
#    - 解析时间戳
#    - 地理位置反查 (可选)
#    - 添加元数据 (主机名、环境)
#
# 3. Output 阶段:
#    - 输出到 Elasticsearch
#    - 重要告警输出到专门的索引
#    - 支持调试输出到控制台
#
# 4. 索引命名规则:
#    - onlyoffice-audit-YYYY.MM.dd (审计日志)
#    - onlyoffice-error-YYYY.MM.dd (错误日志)
#    - onlyoffice-perf-YYYY.MM.dd (性能日志)
#    - onlyoffice-trace-YYYY.MM.dd (追踪日志)
#    - onlyoffice-concurrency-YYYY.MM.dd (并发日志)
#    - onlyoffice-activity-YYYY.MM.dd (用户活动)
#    - onlyoffice-app-YYYY.MM.dd (应用日志)
#    - onlyoffice-alerts-YYYY.MM.dd (重要告警)
#
# 5. 启用此配置:
#    - 确保所有日志文件已存在
#    - 调整路径和模式以匹配实际环境
#    - 根据需要修改过滤规则
#    - 重启 Logstash: docker restart logstash
#
# 6. 验证配置:
#    - 检查 Elasticsearch 索引: curl http://localhost:9200/_cat/indices
#    - 在 Kibana 中创建索引模式: Management > Index Patterns > Create
#    - 创建仪表板进行数据可视化

[program:converter]
; supervisord runs as root and opens no file in the ds-owned log directory; tee writes out.log as ds
command=/bin/bash -c 'exec "$@" > >(exec tee -a /var/log/COMPANY_NAME/documentserver/converter/out.log > /dev/null) 2>&1' converter /var/www/COMPANY_NAME/documentserver/server/FileConverter/converter
directory=/var/www/COMPANY_NAME/documentserver/server/FileConverter
user=ds
environment=NODE_ENV=production-linux,NODE_CONFIG_DIR=/etc/COMPANY_NAME/documentserver,NODE_DISABLE_COLORS=1,APPLICATION_NAME=COMPANY_NAME,LD_LIBRARY_PATH=/var/www/COMPANY_NAME/documentserver/server/FileConverter/bin
stdout_logfile=NONE
autostart=true
autorestart=true
redirect_stderr=true

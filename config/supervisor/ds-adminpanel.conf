[program:adminpanel]
; supervisord runs as root and opens no file in the ds-owned log directory; tee writes out.log as ds
command=/bin/bash -c 'exec "$@" > >(exec tee -a /var/log/COMPANY_NAME/documentserver/adminpanel/out.log > /dev/null) 2>&1' adminpanel /var/www/COMPANY_NAME/documentserver/server/AdminPanel/server/adminpanel
directory=/var/www/COMPANY_NAME/documentserver/server/AdminPanel
user=ds
environment=NODE_ENV=production-linux,NODE_CONFIG_DIR=/etc/COMPANY_NAME/documentserver,NODE_DISABLE_COLORS=1,APPLICATION_NAME=COMPANY_NAME
stdout_logfile=NONE
autostart=true
autorestart=true
redirect_stderr=true

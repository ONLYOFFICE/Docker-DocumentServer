[program:docservice]
; supervisord runs as root and opens no file in the ds-owned log directory; tee writes out.log as ds
command=/bin/bash -c 'exec "$@" > >(exec tee -a /var/log/COMPANY_NAME/documentserver/docservice/out.log > /dev/null) 2>&1' docservice /var/www/COMPANY_NAME/documentserver/server/DocService/docservice
directory=/var/www/COMPANY_NAME/documentserver/server/DocService
user=ds
environment=NODE_ENV=production-linux,NODE_CONFIG_DIR=/etc/COMPANY_NAME/documentserver,NODE_DISABLE_COLORS=1,PKG_NATIVE_CACHE_PATH=/tmp/.cache,APPLICATION_NAME=COMPANY_NAME
stdout_logfile=NONE
autostart=true
autorestart=true
redirect_stderr=true

[program:example]
; supervisord runs as root and opens no file in the ds-owned log directory; tee writes out.log as ds
command=/bin/bash -c 'exec "$@" > >(exec tee -a /var/log/COMPANY_NAME/documentserver-example/out.log > /dev/null) 2>&1' example /var/www/COMPANY_NAME/documentserver-example/example
directory=/var/www/COMPANY_NAME/documentserver-example/
user=ds
environment=NODE_ENV=production-linux,NODE_CONFIG_DIR=/etc/COMPANY_NAME/documentserver-example,NODE_DISABLE_COLORS=1
stdout_logfile=NONE
autostart=false
autorestart=true
redirect_stderr=true

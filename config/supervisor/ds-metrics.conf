[program:metrics]
; supervisord runs as root and opens no file in the ds-owned log directory; tee writes out.log as ds
command=/bin/bash -c 'exec "$@" > >(exec tee -a /var/log/COMPANY_NAME/documentserver/metrics/out.log > /dev/null) 2>&1' metrics /var/www/COMPANY_NAME/documentserver/server/Metrics/metrics ./config/config.js
directory=/var/www/COMPANY_NAME/documentserver/server/Metrics
user=ds
environment=NODE_DISABLE_COLORS=1
stdout_logfile=NONE
autostart=false
autorestart=false
redirect_stderr=true

services:
  onlyoffice-documentserver:
    container_name: onlyoffice-documentserver
    build:
      context: ../.
    depends_on:
      - onlyoffice-graphite
    environment:
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
      - METRICS_HOST=${METRICS_HOST:-localhost}
      - METRICS_PORT=${METRICS_PORT:-8125}
      - METRICS_PREFIX=${METRICS_PREFIX:-ds.}
    stdin_open: true
    restart: always
    expose:
      - '2003'
    ports:
      - '80:80'
    volumes:
      - ./graphite/statsd:/var/www/onlyoffice/documentserver/server/Metrics/config

  onlyoffice-graphite:
    container_name: onlyoffice-graphite
    image: graphiteapp/graphite-statsd
    entrypoint:
      - /bin/sh
      - -ec
      - |
        # A conversion produces more than 50 new series in its first flush.
        # Carbon drops excess creates instead of queuing them for later.
        sed -i 's/^[[:space:]]*MAX_CREATES_PER_MINUTE[[:space:]]*=.*/MAX_CREATES_PER_MINUTE = inf/' /opt/graphite/conf/carbon.conf
        if ! grep -qx 'MAX_CREATES_PER_MINUTE = inf' /opt/graphite/conf/carbon.conf; then
          echo 'Failed to configure the Graphite metric creation limit!' >&2
          exit 1
        fi
        exec /entrypoint
    environment:
      - GRAPHITE_STATSD_HOST=${GRAPHITE_STATSD_HOST:-onlyoffice-documentserver}
      - GRAPHITE_TIME_ZONE=${GRAPHITE_TIME_ZONE:-Etc/UTC}
    ports:
      - '8888:80'
    stdin_open: true
    restart: always

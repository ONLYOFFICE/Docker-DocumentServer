services:
  onlyoffice-documentserver:
    container_name: onlyoffice-documentserver
    build:
      context: ../.
      dockerfile: Dockerfile.enterprise
    depends_on:
      - onlyoffice-mysql
    environment:
      - DB_TYPE=mysql
      - DB_HOST=onlyoffice-mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-onlyoffice}
      - DB_USER=${DB_USER:-onlyoffice}
      - DB_PWD=${DB_PWD:-onlyoffice}
      - DB_TLS_MODE=${DB_TLS_MODE:-verify-full}
      - TLS_CA_CERT=${TLS_CA_CERT:-/var/www/onlyoffice/Data/tls/ca.crt}
    stdin_open: true
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./data:/var/www/onlyoffice/Data

  onlyoffice-mysql:
    container_name: onlyoffice-mysql
    image: mysql:${MYSQL_VERSION:-8.0}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --require_secure_transport=ON
      - --ssl-ca=/tls/ca.crt
      - --ssl-cert=/tls/mysql.crt
      - --ssl-key=/tls/mysql.key
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-onlyoffice}
      - MYSQL_USER=${MYSQL_USER:-onlyoffice}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-onlyoffice}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-onlyoffice}
    restart: always
    expose:
      - '3306'
    volumes:
      - ./data/tls:/tls:ro
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
